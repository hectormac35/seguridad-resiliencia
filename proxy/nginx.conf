worker_processes 1;

events { worker_connections 1024; }

http {
  log_format main '$remote_addr - $request_method $request_uri '
                  'status=$status rt=$request_time ua="$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # No revelar la versión de Nginx
  server_tokens off;

  # Peticiones pequeñas: la API solo recibe JSON corto
  client_max_body_size 16k;

  # Rate limiting por IP: estricto en /login y más amplio en el resto
  limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=general_zone:10m rate=30r/s;
  limit_req_status 429;

  upstream api_upstream {
    server api:8000;
  }

  server {
    listen 80;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Las métricas son internas: Prometheus las lee directamente de api:8000 dentro de la red
    location = /metrics {
      return 404;
    }

    location / {
      limit_req zone=general_zone burst=60 nodelay;

      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /login {
      limit_req zone=login_zone burst=10 nodelay;

      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
