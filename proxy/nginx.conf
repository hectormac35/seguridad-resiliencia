worker_processes 1;

events { worker_connections 1024; }

http {
  log_format main '$remote_addr - $request_method $request_uri '
                  'status=$status rt=$request_time ua="$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # Rate limiting por IP (login)
  limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/s;
  limit_req_status 429;

  upstream api_upstream {
    server api:8000;
  }

  server {
    listen 80;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /login {
      limit_req zone=login_zone burst=10 nodelay;

      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
