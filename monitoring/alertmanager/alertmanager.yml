route:
  receiver: telegram
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 2h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "8386744439:AAHWDeaLo_R2o81QVRPOi_MtGr-1oxjdVFY"
        chat_id: 8428471015
        parse_mode: Markdown
        message: |
          *ALERTA:* {{ .CommonLabels.alertname }}
          *Severidad:* {{ .CommonLabels.severity }}
          *Resumen:* {{ .CommonAnnotations.summary }}
          *Detalle:* {{ .CommonAnnotations.description }}

          *Instancia:* {{ .CommonLabels.instance }}
